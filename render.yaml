services:
  - type: web
    name: student-supervision-system
    runtime: node
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Do NOT set VITE_API_URL - let it use relative paths
